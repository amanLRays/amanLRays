name: Update README Stats

on:
  schedule:
    - cron: '0 */6 * * *'   # runs every 6 hours
  workflow_dispatch:         # lets you trigger it manually from the Actions tab

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create assets folder
        run: mkdir -p profile-assets

      - name: Fetch GitHub Stats card
        run: |
          curl -sL "https://github-readme-stats.vercel.app/api?username=Aman1953&show_icons=true&hide_border=true&count_private=true&bg_color=0D1117&title_color=00FF41&icon_color=00FF41&text_color=C9D1D9" \
          -o profile-assets/stats.svg

      - name: Fetch Top Languages card
        run: |
          curl -sL "https://github-readme-stats.vercel.app/api/top-langs/?username=Aman1953&layout=compact&hide_border=true&bg_color=0D1117&title_color=00FF41&text_color=C9D1D9" \
          -o profile-assets/top-langs.svg

      - name: Fetch Trophy card
        run: |
          curl -sL "https://github-profile-trophy.vercel.app/?username=Aman1953&no-frame=true&column=7&margin-w=8&theme=matrix" \
          -o profile-assets/trophy.svg

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-assets
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update README stats" && git push)
